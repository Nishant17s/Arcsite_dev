<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArcSite — Project Navigator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="logo">A</div>
      <div class="title" id="project-title">ArcSite — Project Navigator</div>
    </div>
    <div class="header-actions">
      <div class="project-name" id="project-name-display">Loading...</div>
      <button class="btn primary" onclick="window.location.href='/'">← All Projects</button>
      <input id="map-upload" type="file" accept="image/*" style="display:none" />
      <label for="map-upload" class="btn" title="Upload a site map image">Upload Map</label>
      <div class="user">JS</div>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Assets</h2>
        <input id="search" type="search" placeholder="Search assets" aria-label="Search assets" />
      </div>

      <div id="asset-list" class="asset-list" role="list"></div>

      <div class="sidebar-footer">
        <small>Data-driven hotspots • Auto-saved</small>
      </div>
    </aside>

    <main class="workspace">
      <section class="map-panel">
        <div class="map-toolbar">
          <div class="map-legend">Site Map</div>
          <div class="map-controls">
            <button id="toggle-edit" class="btn">Edit Mode</button>
            <button id="export-json" class="btn">Export JSON</button>
            <button class="btn">Zoom in</button>
            <button class="btn">Zoom out</button>
          </div>
        </div>

        <div id="map-container">
          <img id="site-map" src="/assets/site-map.svg" alt="Site Map" />
          <div id="hotspot-layer" aria-hidden="false"></div>
          <div id="popup" class="hidden" role="dialog" aria-live="polite"></div>
        </div>

        <div id="editor-panel" class="editor-panel hidden" aria-hidden="true">
          <h4>Asset editor</h4>
          <div id="editor-content">
            <div class="editor-row"><label>Title:</label><span id="ed-title"></span></div>
            <div class="editor-row"><label>X:</label><input id="ed-x" type="text" /></div>
            <div class="editor-row"><label>Y:</label><input id="ed-y" type="text" /></div>
            <div class="editor-row"><label>W:</label><input id="ed-w" type="text" /></div>
            <div class="editor-row"><label>H:</label><input id="ed-h" type="text" /></div>
            <div class="editor-actions">
              <button id="ed-save" class="btn primary">Save</button>
              <button id="ed-nudge-left" class="btn">◀</button>
              <button id="ed-nudge-right" class="btn">▶</button>
              <button id="ed-nudge-up" class="btn">▲</button>
              <button id="ed-nudge-down" class="btn">▼</button>
            </div>
          </div>
        </div>

        <p class="hint">Hover or click a building to view its documents.</p>
      </section>
    </main>
  </div>

  <script src="/project-app.js" defer></script>
</body>
</html>
